version: '3.8'

services:
  # Host Environment SDK Isolation Sandbox
  app:
    image: elixir:1.17
    container_name: transactional-system-elixir-phoenix-app
    volumes:
      - .:/app
    working_dir: /app
    environment:
      - MIX_ENV=dev
      - PORT=4000
      - DATABASE_URL=${DATABASE_URL:-postgresql://dev_user:dev_password@postgresql:5432/transactional-system-elixir-phoenix_db}
    ports:
      - "4000:4000"
    depends_on:
      - postgresql

  # Database Service (postgresql)
  postgresql:
    image: postgres:16-alpine
    container_name: transactional-system-elixir-phoenix-db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-transactional-system-elixir-phoenix_db}
      POSTGRES_USER: ${POSTGRES_USER:-dev_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev_password}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: transactional-system-elixir-phoenix-redis
    ports:
      - "6379:6379"

volumes:
  db_data:
